name: build-image-rust-web

on:
  workflow_dispatch:
  push:
    branches: [ master ]

concurrency:
  group: build-image-rust-web
  cancel-in-progress: true

jobs:
  build:
    name: build-rust-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          docker system prune -af || true
          df -h

      # https://github.com/orgs/community/discussions/42479#discussioncomment-4484937
      # https://github.com/wph95/opentelemetry-demo-webstore/blob/ae08811157db7ba590a7c8dd6faa2cb9d1473bef/.github/workflows/release.yml#L24-L29
      # limit docker push image concurrency to 1
      # to avoid github package return 429 ratelimit error
      - name: Set docker upload concurrent
        run: |
          echo $'{"max-concurrent-downloads": 50, "max-concurrent-uploads": 2}' | sudo dd status=none of=/etc/docker/daemon.json
          sudo service docker restart

      # https://discourse.nixos.org/t/building-docker-image-in-github-actions-leads-to-skopeo-related-issues/40636/4
      - name: Fix dockerTools.pullImage issue
        run: |
          sudo chmod 755 /run/containers
          sudo mkdir -p "/run/containers/$(id -u runner)"
          sudo chown runner: "/run/containers/$(id -u runner)"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        run: |
          sudo mkdir -p /etc/nix
          printf '%s\n' 'experimental-features = nix-command flakes' | sudo tee -a /etc/nix/nix.conf
          curl -L https://nixos.org/nix/install | sh -s -- --daemon --yes
          echo '/nix/var/nix/profiles/default/bin' >> "$GITHUB_PATH"

      - name: Build reports
        run: |
          nix build --extra-experimental-features nix-command --extra-experimental-features flakes .#images.rust-web.reports --print-out-paths --no-link > report-path.txt
          cp -R "$(cat report-path.txt)" reports

      - name: Validate reports
        run: |
          nix build --extra-experimental-features nix-command --extra-experimental-features flakes .#checks.x86_64-linux.reports-rust-web --no-link

      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: reports-rust-web
          path: reports

      - name: Build OCI image artifact
        run: |
          nix build --extra-experimental-features nix-command --extra-experimental-features flakes .#images.rust-web.oci --print-out-paths --no-link > oci-path.txt

      - name: Validate OCI image artifact
        run: |
          nix build --extra-experimental-features nix-command --extra-experimental-features flakes .#checks.x86_64-linux.artifact-image-rust-web --no-link

      - name: Load OCI image
        run: |
          nix run --extra-experimental-features nix-command --extra-experimental-features flakes .#load-rust-web

      - name: Run smoke plan
        env:
          SMOKE_LOG_DIR: smoke-logs
        run: |
          nix run --extra-experimental-features nix-command --extra-experimental-features flakes .#run-smoke-plan -- rust-web

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-rust-web
          path: smoke-logs

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          image_ref="$(jq -r '.imageRef' reports/ci-plan.json)"
          mapfile -t publish_refs < <(jq -r '.publishRefs[]' reports/ci-plan.json)
          for publish_ref in "${publish_refs[@]}"; do
            if [ "$publish_ref" != "$image_ref" ]; then
              docker tag "$image_ref" "$publish_ref"
            fi
            docker push "$publish_ref"
          done
          docker inspect "$image_ref" --format='{{index .RepoDigests 0}}' > digest.txt

      - name: Upload digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: digest-rust-web
          path: digest.txt
