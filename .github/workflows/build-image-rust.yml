


name: build-image-rust

on:
  workflow_dispatch:
  push:
    branches: [ master ]

concurrency:
  group: build-image-rust
  cancel-in-progress: true

env:
  CACHIX_CACHE_NAME: hellodword-codex
  CACHIX_PUBLIC_KEY: hellodword-codex.cachix.org-1:0URmcnC9aynWh9+FJ2tf+HQloylGgZzPtrz3sttTTiQ=

jobs:
  build:
    name: build-rust
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_validate-image.yml
    with:
      image: rust
      upload_reports: true
      upload_smoke_logs: true
      push_image: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      cachix_cache_name: hellodword-codex
      cachix_public_key: hellodword-codex.cachix.org-1:0URmcnC9aynWh9+FJ2tf+HQloylGgZzPtrz3sttTTiQ=

  e2e:
    name: e2e-rust-${{ matrix.session }}
    needs: build
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        session: ["disabled"]

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          docker system prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix with official installer
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y xz-utils
          curl -L https://nixos.org/nix/install | sh -s -- --daemon
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
          echo "NIX_REMOTE=daemon" >> "$GITHUB_ENV"
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix --version

      - name: Configure Nix
        shell: bash
        run: |
          set -euxo pipefail
          sudo sed -i \
            -e '/^experimental-features[[:space:]]*=/d' \
            -e '/^max-jobs[[:space:]]*=/d' \
            -e '/^substituters[[:space:]]*=/d' \
            -e '/^trusted-public-keys[[:space:]]*=/d' \
            -e '/^trusted-users[[:space:]]*=/d' \
            /etc/nix/nix.conf

          printf '%s\n' \
            "experimental-features = nix-command flakes" \
            "max-jobs = auto" \
            "trusted-users = root ${USER}" \
            "extra-substituters = https://${CACHIX_CACHE_NAME}.cachix.org" \
            "extra-trusted-public-keys = ${CACHIX_PUBLIC_KEY}" \
            | sudo tee -a /etc/nix/nix.conf

          sudo systemctl restart nix-daemon
          nix config show experimental-features
          nix config show substituters

      - name: Enable KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "/dev/kvm is missing; e2e requires a KVM-capable runner" >&2
            exit 1
          fi

          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Run e2e test
        run: |
          set -euo pipefail

          attr=".#e2e.x86_64-linux.e2e-vscode-rust-${{ matrix.session }}"

          drv_path="$(
            nix path-info \
              --accept-flake-config \
              --derivation \
              "$attr"
          )"

          printf '%s\n' "$drv_path" > e2e-drv-path.txt

          set +e
          NO_COLOR=1 TERM=dumb nix build \
            --accept-flake-config \
            "$attr" \
            --print-out-paths \
            --no-link \
            >e2e-output-path.txt \
            2>e2e-build.stderr.log
          status="$?"
          set -e

          if [ "$status" -eq 0 ]; then
            output_path="$(tail -n1 e2e-output-path.txt)"
            test -n "$output_path"

            mkdir -p e2e-output
            if [ -d "$output_path" ]; then
              cp -R "$output_path"/. e2e-output/
            else
              cp -R "$output_path" e2e-output/
            fi

            exit 0
          fi

          mkdir -p e2e-logs
          cp e2e-build.stderr.log e2e-logs/

          NO_COLOR=1 TERM=dumb nix \
            --extra-experimental-features nix-command \
            --extra-experimental-features flakes \
            --log-format raw \
            log "$drv_path" \
            >"e2e-logs/$(basename "$drv_path").log" \
            2>&1 || true

          sed -r -i 's/\x1B\[[0-9;]*[mK]//g' e2e-logs/*.log

          exit "$status"

      - name: Upload e2e output
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output-rust-${{ matrix.session }}
          path: e2e-output
          if-no-files-found: error

      - name: Upload e2e nix logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-nix-logs-rust-${{ matrix.session }}
          path: e2e-logs
          if-no-files-found: warn
