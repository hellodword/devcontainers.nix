name: Verify, publish images, and cache

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainers-pipeline
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out core infra repository
        uses: actions/checkout@v7
        with:
          repository: hellodword/nixos-config
          ref: master
          path: core
          persist-credentials: false

      - name: Check out devcontainers.nix
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: project
          persist-credentials: false

      - name: Verify manifest, build groups, VM checks, and release contract
        uses: ./core/infra/action
        with:
          mode: verify
          project-dir: project
          run-builds: "true"
          publish-cache: ${{ github.ref == 'refs/heads/master' && 'true' || 'false' }}
          signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          keep-container: "true"
          artifact-suffix: verify
          post-build-command: |
            oci_out="$(jq -r '.groups[] | select(.name == "build") | .entries[] | select(.name == "oci") | .outputs[0]' /ci/manifest.json)"
            cd /workspace
            python3 tests/check_publish.py --oci-dir "$oci_out"

      - name: Publish digest-preserving OCI tags to GHCR
        if: github.ref == 'refs/heads/master'
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          REMOTE_URL: ${{ format('{0}/{1}.git', github.server_url, github.repository) }}
        run: |
          set -euo pipefail
          target_sha="$(git -C project rev-parse HEAD)"
          action_sha="$(git -C core rev-parse HEAD)"
          rm -f "$NIX_CI_STATE/publish-summary.md"
          docker exec \
            --env GHCR_ACTOR \
            --env GHCR_TOKEN \
            --env TARGET_SHA="$target_sha" \
            --env ACTION_SHA="$action_sha" \
            --env REMOTE_URL \
            "$NIX_CI_CONTAINER" bash -euo pipefail -c '
              export PATH="$(cat /ci/tools)/bin:$PATH"
              GITHUB_STEP_SUMMARY=/ci/publish-summary.md python3 /workspace/scripts/publish.py \
                --manifest /ci/manifest.json \
                --login-env \
                --registry ghcr.io \
                --repository hellodword/devcontainers-dev \
                --commit-sha "$TARGET_SHA" \
                --expected-master-ref refs/heads/master \
                --git-remote "$REMOTE_URL" \
                --flake-lock /workspace/flake.lock \
                --action-sha "$ACTION_SHA"
            '
          cat "$NIX_CI_STATE/publish-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect diagnostics and tear down Nix CI container
        if: always()
        uses: ./core/infra/action
        with:
          mode: finalize
          project-dir: project
          artifact-suffix: verify
