name: Verify, publish images, and cache

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainers-pipeline
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out core infra repository
        uses: actions/checkout@v7
        with:
          repository: hellodword/nixos-config
          ref: master
          path: core
          sparse-checkout: infra
          persist-credentials: false

      - name: Check out devcontainers.nix
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: project
          persist-credentials: false

      - name: Verify manifest, publish signed cache, and release OCI tags
        uses: ./core/infra/actions/verify
        with:
          project-dir: project
          signing-key: ${{ github.ref == 'refs/heads/master' && secrets.NIX_CACHE_SIGNING_KEY || '' }}
          release: |
            if [[ "${{ github.ref }}" != "refs/heads/master" ]]; then
              exit 0
            fi
            /ci/jobs/publish-cli/bin/publish-devcontainers \
              --oci-dir /ci/jobs/oci \
              --login-env \
              --registry ghcr.io \
              --repository hellodword/devcontainers-dev \
              --commit-sha "$NIX_CI_COMMIT_SHA" \
              --expected-master-ref refs/heads/master \
              --git-remote "$NIX_CI_GIT_REMOTE" \
              --flake-lock /workspace/flake.lock \
              --action-sha "$NIX_CI_INFRA_SHA"
