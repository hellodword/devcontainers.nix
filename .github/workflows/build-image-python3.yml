name: build-image-python3

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - flake.nix
      - flake.lock
      - images/**
      - lib/**
      - runtime/**
      - tests/**
      - .github/workflows/**

jobs:
  build:
    uses: ./.github/workflows/_build-image.yml
    with:
      image-target: python3
