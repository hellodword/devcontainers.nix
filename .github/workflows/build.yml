name: build

on:
  workflow_dispatch:
    inputs:
      image-target:
        description: image target to build
        required: true
        default: nix-latest
        type: string

jobs:
  build:
    name: build-${{ inputs.image-target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          docker system prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        run: |
          sudo mkdir -p /etc/nix
          printf '%s\n' 'experimental-features = nix-command flakes' | sudo tee -a /etc/nix/nix.conf
          curl -L https://nixos.org/nix/install | sh -s -- --daemon --yes
          echo '/nix/var/nix/profiles/default/bin' >> "$GITHUB_PATH"

      - name: Build reports
        run: |
          nix build .#images.${{ inputs.image-target }}.reports --print-out-paths --no-link > report-path.txt
          cp -R "$(cat report-path.txt)" reports

      - name: Validate reports
        run: |
          python3 tests/ci/check-reports.py reports "${{ inputs.image-target }}"

      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ inputs.image-target }}
          path: reports

      - name: Build OCI image artifact
        run: |
          nix build .#images.${{ inputs.image-target }}.oci --print-out-paths --no-link > oci-path.txt

      - name: Validate OCI image artifact
        run: |
          python3 tests/ci/check-image-tar.py "$(cat oci-path.txt)" reports "${{ inputs.image-target }}"

      - name: Load OCI image
        run: |
          nix run .#load-${{ inputs.image-target }}

      - name: Run smoke plan
        env:
          SMOKE_LOG_DIR: smoke-logs
        run: |
          image_ref="$(jq -r '.imageRef' reports/ci-plan.json)"
          plan_path="$(nix build .#images.${{ inputs.image-target }}.smoke --print-out-paths --no-link)"
          chmod +x tests/smoke/run-plan.sh
          ./tests/smoke/run-plan.sh "$image_ref" "$plan_path"

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-${{ inputs.image-target }}
          path: smoke-logs
