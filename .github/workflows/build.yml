name: build

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          docker system prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        run: |
          sudo mkdir -p /etc/nix
          printf '%s\n' 'experimental-features = nix-command flakes' | sudo tee -a /etc/nix/nix.conf
          curl -L https://nixos.org/nix/install | sh -s -- --daemon --yes
          echo '/nix/var/nix/profiles/default/bin' >> "$GITHUB_PATH"

      - name: Flake check
        run: nix flake check --keep-going

      - name: Check generated workflows
        run: |
          nix run .#generate-workflows
          git diff --exit-code .github/workflows

      - name: Check runtime tools
        run: |
          chmod +x tests/ci/check-runtime-tools.sh
          tests/ci/check-runtime-tools.sh

      - name: Show CI plan
        run: |
          for image in $(nix eval --json .#lib.x86_64-linux.imageNames | jq -r '.[]'); do
            echo "==> $image"
            nix build .#images.$image.ci-plan-json --print-out-paths --no-link | xargs cat
          done
