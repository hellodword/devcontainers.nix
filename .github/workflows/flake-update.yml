name: flake-update

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

env:
  BASE_BRANCH: master
  CACHIX_CACHE_NAME: hellodword-codex
  CACHIX_PUBLIC_KEY: hellodword-codex.cachix.org-1:0URmcnC9aynWh9+FJ2tf+HQloylGgZzPtrz3sttTTiQ=

jobs:
  prepare:
    name: update-and-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      changed: ${{ steps.plan.outputs.changed }}
      images: ${{ steps.plan.outputs.images }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          docker system prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0

      - name: Remember base sha
        id: base
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install and configure Nix
        shell: bash
        env:
          GITHUB_ACCESS_TOKEN: ${{ github.token }}
          NIX_EXTRA_SUBSTITUTERS: |
            https://${{ env.CACHIX_CACHE_NAME }}.cachix.org
          NIX_EXTRA_TRUSTED_PUBLIC_KEYS: |
            ${{ env.CACHIX_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y curl ca-certificates xz-utils

          curl -fsSL https://nixos.org/nix/install | sh -s -- --daemon
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
          echo "NIX_REMOTE=daemon" >> "$GITHUB_ENV"

          export NIX_REMOTE=daemon
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh

          normalize_list() {
            local s="${1:-}"
            s="${s//$'\n'/ }"
            s="${s//$'\t'/ }"
            printf '%s\n' "$s" | awk '{$1=$1; print}'
          }

          current_user="$(id -un)"

          nix_experimental_features="$(
            normalize_list "${NIX_EXPERIMENTAL_FEATURES:-nix-command flakes}"
          )"
          nix_trusted_users="$(
            normalize_list "${NIX_TRUSTED_USERS:-root ${current_user}}"
          )"
          nix_max_jobs="$(
            normalize_list "${NIX_MAX_JOBS:-auto}"
          )"
          nix_access_tokens="$(
            normalize_list "${NIX_ACCESS_TOKENS:-}"
          )"

          if [[ -z "$nix_access_tokens" && -n "${GITHUB_ACCESS_TOKEN:-}" ]]; then
            nix_access_tokens="github.com=${GITHUB_ACCESS_TOKEN}"
          fi

          nix_extra_substituters="$(
            normalize_list "${NIX_EXTRA_SUBSTITUTERS:-}"
          )"
          nix_extra_trusted_public_keys="$(
            normalize_list "${NIX_EXTRA_TRUSTED_PUBLIC_KEYS:-}"
          )"

          sudo mkdir -p /etc/nix
          sudo touch /etc/nix/nix.conf
          sudo sed -i \
            -e '/^[[:space:]]*experimental-features[[:space:]]*=/d' \
            -e '/^[[:space:]]*max-jobs[[:space:]]*=/d' \
            -e '/^[[:space:]]*trusted-users[[:space:]]*=/d' \
            -e '/^[[:space:]]*access-tokens[[:space:]]*=/d' \
            -e '/^[[:space:]]*substituters[[:space:]]*=/d' \
            -e '/^[[:space:]]*trusted-public-keys[[:space:]]*=/d' \
            -e '/^[[:space:]]*extra-substituters[[:space:]]*=/d' \
            -e '/^[[:space:]]*extra-trusted-public-keys[[:space:]]*=/d' \
            /etc/nix/nix.conf

          {
            printf '\n'
            printf '%s\n' '# CI Nix settings'
            printf '%s\n' "experimental-features = ${nix_experimental_features}"
            printf '%s\n' "max-jobs = ${nix_max_jobs}"
            printf '%s\n' "trusted-users = ${nix_trusted_users}"

            if [[ -n "$nix_access_tokens" ]]; then
              printf '%s\n' "access-tokens = ${nix_access_tokens}"
            fi

            if [[ -n "$nix_extra_substituters" ]]; then
              printf '%s\n' "extra-substituters = ${nix_extra_substituters}"
            fi

            if [[ -n "$nix_extra_trusted_public_keys" ]]; then
              printf '%s\n' "extra-trusted-public-keys = ${nix_extra_trusted_public_keys}"
            fi
          } | sudo tee -a /etc/nix/nix.conf >/dev/null

          sudo systemctl restart nix-daemon.service

          nix --version
          nix config show experimental-features
          nix config show substituters
          nix config show trusted-public-keys
          nix config show trusted-users

      - name: Apply inherited Nix cache config
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f flake.nix ]]; then
            echo "No flake.nix found; skipping inherited Nix cache config"
            exit 0
          fi

          eval_args=(
            --extra-experimental-features nix-command
            --extra-experimental-features flakes
            --no-write-lock-file
          )

          if ! nix eval --json "${eval_args[@]}" .#lib.x86_64-linux.inheritedNixConfig >/dev/null 2>&1; then
            echo "No inheritedNixConfig output found; skipping inherited Nix cache config"
            exit 0
          fi

          normalize_list() {
            local s="${1:-}"
            s="${s//$'\n'/ }"
            s="${s//$'\t'/ }"
            printf '%s\n' "$s" | awk '{$1=$1; print}'
          }

          flake_output_list() {
            local attr="$1"
            nix eval --raw \
              "${eval_args[@]}" \
              ".#lib.x86_64-linux.inheritedNixConfig.${attr}" \
              --apply 'builtins.concatStringsSep " "'
          }

          read_nix_conf_values() {
            local key="$1"
            awk -v key="$key" '
              $0 ~ "^[[:space:]]*" key "[[:space:]]*=" {
                sub(/^[^=]*=/, "")
                print
              }
            ' /etc/nix/nix.conf
          }

          merge_lists() {
            normalize_list "$*" | awk '
              {
                for (i = 1; i <= NF; i++) {
                  if (!seen[$i]++) {
                    values[++count] = $i
                  }
                }
              }
              END {
                for (i = 1; i <= count; i++) {
                  printf "%s%s", (i == 1 ? "" : " "), values[i]
                }
                if (count > 0) {
                  printf "\n"
                }
              }
            '
          }

          current_extra_substituters="$(normalize_list "$(read_nix_conf_values extra-substituters)")"
          current_extra_trusted_public_keys="$(normalize_list "$(read_nix_conf_values extra-trusted-public-keys)")"

          inherited_substituters="$(normalize_list "$(flake_output_list substituters)")"
          inherited_trusted_public_keys="$(normalize_list "$(flake_output_list trustedPublicKeys)")"

          merged_extra_substituters="$(merge_lists "$current_extra_substituters" "$inherited_substituters")"
          merged_extra_trusted_public_keys="$(merge_lists "$current_extra_trusted_public_keys" "$inherited_trusted_public_keys")"

          sudo sed -i \
            -e '/^[[:space:]]*extra-substituters[[:space:]]*=/d' \
            -e '/^[[:space:]]*extra-trusted-public-keys[[:space:]]*=/d' \
            /etc/nix/nix.conf

          {
            if [[ -n "$merged_extra_substituters" ]]; then
              printf '%s\n' "extra-substituters = ${merged_extra_substituters}"
            fi

            if [[ -n "$merged_extra_trusted_public_keys" ]]; then
              printf '%s\n' "extra-trusted-public-keys = ${merged_extra_trusted_public_keys}"
            fi
          } | sudo tee -a /etc/nix/nix.conf >/dev/null

          sudo systemctl restart nix-daemon.service

          nix config show substituters
          nix config show trusted-public-keys

      - name: Update flake and generated files
        shell: bash
        run: |
          set -euo pipefail

          nix flake update --accept-flake-config

          # Keep generated build-image workflows in sync after nixpkgs/toolchain bumps.
          nix run --accept-flake-config .#generate-workflows

          # Keep generated README/docs snippets in sync when image tags move.
          nix run --accept-flake-config .#generate-docs

          # Stage before checks and patch creation so the patch is the exact tested state.
          git add -A

      - name: Nix flake check
        run: |
          nix flake check --accept-flake-config

      - name: Plan PR and validation
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          if git diff --cached --quiet --exit-code; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo 'images=["__no_changes__"]' >> "$GITHUB_OUTPUT"
            echo "No flake update changes; nothing to validate or merge."
            exit 0
          fi

          images="$(
            nix eval --accept-flake-config --json .#lib.x86_64-linux.imageNames \
              | tr -d '\n'
          )"

          if [[ -z "$images" || "$images" == "[]" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo 'images=["__no_changes__"]' >> "$GITHUB_OUTPUT"
            echo "Flake changed, but image matrix is empty; skipping PR creation to avoid an invalid validation plan."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "images=${images}" >> "$GITHUB_OUTPUT"

          git diff --cached --stat
          git diff --cached --binary > update.patch

          printf 'images=%s\n' "$images"

      - name: Upload update patch
        if: steps.plan.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: flake-update-patch
          path: update.patch
          if-no-files-found: error

  validate-image:
    name: validate-${{ matrix.image }}
    needs: prepare
    if: ${{ needs.prepare.outputs.changed == 'true' }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.images) }}
    uses: ./.github/workflows/_validate-image.yml
    with:
      image: ${{ matrix.image }}
      checkout_ref: ${{ needs.prepare.outputs.base_sha }}
      patch_artifact: flake-update-patch
      upload_reports: false
      upload_smoke_logs: true
      push_image: false
      cachix_cache_name: hellodword-codex
      cachix_public_key: hellodword-codex.cachix.org-1:0URmcnC9aynWh9+FJ2tf+HQloylGgZzPtrz3sttTTiQ=

  create-pr-and-merge:
    name: create-pr-and-merge
    needs:
      - prepare
      - validate-image
    if: ${{ always() && needs.prepare.outputs.changed == 'true' && needs.validate-image.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0

      - name: Download update patch
        uses: actions/download-artifact@v7
        with:
          name: flake-update-patch
          path: .ci/flake-update

      - name: Commit update branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail

          branch="automation/flake-update-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git switch -c "$branch"
          git apply --index --whitespace=nowarn .ci/flake-update/update.patch

          if git diff --cached --quiet --exit-code; then
            echo "No changes after applying patch; skipping PR creation."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --cached --stat

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: update flake inputs"
          git push --set-upstream origin "$branch"

          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Create PR and merge
        if: steps.branch.outputs.created == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail

          PR_URL="$(gh pr create --fill --base "${BASE_BRANCH}" --head "${BRANCH}")"
          gh pr merge "$PR_URL" --delete-branch --rebase
