name: Update flake inputs

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainers-pipeline
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - name: Check out core infra repository
        uses: actions/checkout@v7
        with:
          repository: hellodword/nixos-config
          ref: master
          path: core
          persist-credentials: false

      - name: Check out devcontainers.nix
        uses: actions/checkout@v7
        with:
          ref: refs/heads/master
          fetch-depth: 0
          path: project
          persist-credentials: false

      - name: Prepare flake input update candidate
        id: prepare
        uses: ./core/infra/action
        with:
          mode: prepare-update
          project-dir: project

      - name: Verify candidate across build groups, VM checks, and release contract
        if: steps.prepare.outputs.changed == 'true'
        uses: ./core/infra/action
        with:
          mode: verify
          project-dir: project
          run-builds: "true"
          publish-cache: "true"
          signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          keep-container: "true"
          artifact-suffix: update
          post-build-command: |
            oci_out="$(jq -r '.groups[] | select(.name == "build") | .entries[] | select(.name == "oci") | .outputs[0]' /ci/manifest.json)"
            cd /workspace
            nix develop --no-update-lock-file .#default --command bash -euo pipefail -c '
              python3 tests/check_runtime_cache.py
              python3 tests/check_publish.py --oci-dir "$1"
            ' _ "$oci_out"

      - name: Preflight GHCR authentication before fast-forwarding master
        if: steps.prepare.outputs.changed == 'true'
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker exec \
            --env GHCR_ACTOR \
            --env GHCR_TOKEN \
            "$NIX_CI_CONTAINER" bash -euo pipefail -c '
              export PATH="$(cat /ci/tools)/bin:$PATH"
              python3 /workspace/scripts/publish.py --registry ghcr.io --login-env --preflight-only
            '

      - name: Fast-forward master to verified candidate
        id: merge
        if: steps.prepare.outputs.changed == 'true'
        uses: ./core/infra/action
        with:
          mode: merge-update
          project-dir: project

      - name: Publish digest-preserving OCI tags to GHCR
        if: steps.prepare.outputs.changed == 'true' && steps.merge.outputs.merged == 'true'
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.prepare.outputs.candidate-sha }}
          REMOTE_URL: ${{ format('{0}/{1}.git', github.server_url, github.repository) }}
        run: |
          set -euo pipefail
          action_sha="$(git -C core rev-parse HEAD)"
          rm -f "$NIX_CI_STATE/publish-summary.md"
          docker exec \
            --env GHCR_ACTOR \
            --env GHCR_TOKEN \
            --env CANDIDATE_SHA \
            --env ACTION_SHA="$action_sha" \
            --env REMOTE_URL \
            "$NIX_CI_CONTAINER" bash -euo pipefail -c '
              export PATH="$(cat /ci/tools)/bin:$PATH"
              GITHUB_STEP_SUMMARY=/ci/publish-summary.md python3 /workspace/scripts/publish.py \
                --manifest /ci/manifest.json \
                --login-env \
                --registry ghcr.io \
                --repository hellodword/devcontainers-dev \
                --commit-sha "$CANDIDATE_SHA" \
                --expected-master-ref refs/heads/master \
                --git-remote "$REMOTE_URL" \
                --flake-lock /workspace/flake.lock \
                --action-sha "$ACTION_SHA"
            '
          cat "$NIX_CI_STATE/publish-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect diagnostics and tear down Nix CI container
        if: always() && steps.prepare.outputs.changed == 'true'
        uses: ./core/infra/action
        with:
          mode: finalize
          project-dir: project
          artifact-suffix: update
