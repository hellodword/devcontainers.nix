name: Update flake inputs

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainers-pipeline
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - name: Check out core infra repository
        uses: actions/checkout@v7
        with:
          repository: hellodword/nixos-config
          ref: master
          path: core
          sparse-checkout: infra
          persist-credentials: false

      - name: Check out devcontainers.nix
        uses: actions/checkout@v7
        with:
          ref: refs/heads/master
          fetch-depth: 0
          path: project
          persist-credentials: false

      - name: Update flake inputs, verify candidate, fast-forward master, and publish OCI tags
        uses: ./core/infra/actions/update
        with:
          project-dir: project
          signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          preflight: |
            GHCR_ACTOR="$GITHUB_ACTOR" GHCR_TOKEN="$GITHUB_TOKEN" \
              /ci/jobs/publish-cli/bin/publish-devcontainers \
                --registry ghcr.io \
                --login-env \
                --preflight-only
          release: |
            GHCR_ACTOR="$GITHUB_ACTOR" GHCR_TOKEN="$GITHUB_TOKEN" \
              /ci/jobs/publish-cli/bin/publish-devcontainers \
                --oci-dir /ci/jobs/oci \
                --login-env \
                --registry ghcr.io \
                --repository hellodword/devcontainers-dev \
                --commit-sha "$NIX_CI_COMMIT_SHA" \
                --expected-master-ref refs/heads/master \
                --git-remote "$NIX_CI_GIT_REMOTE" \
                --flake-lock /workspace/flake.lock \
                --action-sha "$NIX_CI_INFRA_SHA"
