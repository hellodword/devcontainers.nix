name: manifest

on:
  workflow_dispatch:
    inputs:
      source-run-id:
        description: workflow run id that produced digest-* artifacts
        required: true
        type: string
      tag-suffix:
        description: optional suffix appended to the image tag, for example rc1
        required: false
        default: ""
        type: string

jobs:
  manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          docker system prune -af || true
          df -h

      # https://github.com/orgs/community/discussions/42479#discussioncomment-4484937
      # https://github.com/wph95/opentelemetry-demo-webstore/blob/ae08811157db7ba590a7c8dd6faa2cb9d1473bef/.github/workflows/release.yml#L24-L29
      # limit docker push image concurrency to 1
      # to avoid github package return 429 ratelimit error
      - name: Set docker upload concurrent
        run: |
          echo $'{"max-concurrent-downloads": 50, "max-concurrent-uploads": 2}' | sudo dd status=none of=/etc/docker/daemon.json
          sudo service docker restart

      # https://discourse.nixos.org/t/building-docker-image-in-github-actions-leads-to-skopeo-related-issues/40636/4
      - name: Fix dockerTools.pullImage issue
        run: |
          sudo chmod 755 /run/containers
          sudo mkdir -p "/run/containers/$(id -u runner)"
          sudo chown runner: "/run/containers/$(id -u runner)"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        run: |
          sudo mkdir -p /etc/nix
          printf '%s\n' 'experimental-features = nix-command flakes' | sudo tee -a /etc/nix/nix.conf
          curl -L https://nixos.org/nix/install | sh -s -- --daemon --yes
          echo '/nix/var/nix/profiles/default/bin' >> "$GITHUB_PATH"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Aggregate digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
          TAG_SUFFIX: ${{ inputs.tag-suffix }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t targets < <(nix eval --extra-experimental-features nix-command --extra-experimental-features flakes --json .#lib.x86_64-linux.imageNames | jq -r '.[]')
          mkdir -p manifest-artifacts

          for target in "${targets[@]}"; do
            artifact_name="digest-$target"
            artifact_id="$(
              gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" \
                --jq ".artifacts[] | select(.name == \"$artifact_name\") | .id" \
                | head -n1
            )"

            if [ -z "$artifact_id" ]; then
              echo "missing artifact: $artifact_name" >&2
              exit 1
            fi

            zip_path="manifest-artifacts/$artifact_name.zip"
            out_dir="manifest-artifacts/$artifact_name"
            gh api "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" >"$zip_path"
            unzip -q "$zip_path" -d "$out_dir"

            digest="$(tr -d '\n' <"$out_dir/digest.txt")"
            ci_plan="$(nix build --extra-experimental-features nix-command --extra-experimental-features flakes ".#images.$target.ci-plan-json" --print-out-paths --no-link)"
            mapfile -t publish_refs < <(jq -r '.publishRefs[]' "$ci_plan")

            for target_ref in "${publish_refs[@]}"; do
              if [ -n "$TAG_SUFFIX" ]; then
                target_ref="${target_ref%:*}:${target_ref##*:}-$TAG_SUFFIX"
              fi

              echo "publishing $target_ref from $digest"
              docker buildx imagetools create -t "$target_ref" "$digest"
            done
          done
