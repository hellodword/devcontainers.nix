name: _validate-image

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string

      checkout_ref:
        required: false
        type: string
        default: ""

      patch_artifact:
        required: false
        type: string
        default: ""

      upload_reports:
        required: false
        type: boolean
        default: true

      upload_smoke_logs:
        required: false
        type: boolean
        default: true

      push_image:
        required: false
        type: boolean
        default: false

      cachix_cache_name:
        required: false
        type: string
        default: hellodword-codex

      cachix_public_key:
        required: false
        type: string
        default: hellodword-codex.cachix.org-1:0URmcnC9aynWh9+FJ2tf+HQloylGgZzPtrz3sttTTiQ=

jobs:
  validate:
    name: validate-${{ inputs.image }}
    runs-on: ubuntu-latest

    env:
      CACHIX_CACHE_NAME: ${{ inputs.cachix_cache_name }}
      CACHIX_PUBLIC_KEY: ${{ inputs.cachix_public_key }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          docker system prune -af || true
          df -h

      # https://github.com/orgs/community/discussions/42479#discussioncomment-4484937
      # https://github.com/wph95/opentelemetry-demo-webstore/blob/ae08811157db7ba590a7c8dd6faa2cb9d1473bef/.github/workflows/release.yml#L24-L29
      # Limit docker push image concurrency to avoid GHCR 429 rate limit errors.
      - name: Set docker upload concurrent
        run: |
          echo $'{"max-concurrent-downloads": 50, "max-concurrent-uploads": 2}' | sudo dd status=none of=/etc/docker/daemon.json
          sudo service docker restart

      # https://discourse.nixos.org/t/building-docker-image-in-github-actions-leads-to-skopeo-related-issues/40636/4
      - name: Fix dockerTools.pullImage issue
        run: |
          sudo chmod 755 /run/containers
          sudo mkdir -p "/run/containers/$(id -u runner)"
          sudo chown runner: "/run/containers/$(id -u runner)"

      - name: Checkout
        if: inputs.checkout_ref == ''
        uses: actions/checkout@v7

      - name: Checkout ref
        if: inputs.checkout_ref != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0

      - name: Download patch
        if: inputs.patch_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.patch_artifact }}
          path: .ci/flake-update

      - name: Apply patch
        if: inputs.patch_artifact != ''
        run: |
          git apply --index --whitespace=nowarn .ci/flake-update/update.patch
          git diff --cached --stat

      - name: Install and configure Nix
        shell: bash
        env:
          GITHUB_ACCESS_TOKEN: ${{ github.token }}
          NIX_EXTRA_SUBSTITUTERS: |
            https://${{ env.CACHIX_CACHE_NAME }}.cachix.org
          NIX_EXTRA_TRUSTED_PUBLIC_KEYS: |
            ${{ env.CACHIX_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y curl ca-certificates xz-utils

          curl -fsSL https://nixos.org/nix/install | sh -s -- --daemon
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
          echo "NIX_REMOTE=daemon" >> "$GITHUB_ENV"

          export NIX_REMOTE=daemon
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh

          normalize_list() {
            local s="${1:-}"
            s="${s//$'\n'/ }"
            s="${s//$'\t'/ }"
            printf '%s\n' "$s" | awk '{$1=$1; print}'
          }

          current_user="$(id -un)"

          nix_experimental_features="$(
            normalize_list "${NIX_EXPERIMENTAL_FEATURES:-nix-command flakes}"
          )"
          nix_trusted_users="$(
            normalize_list "${NIX_TRUSTED_USERS:-root ${current_user}}"
          )"
          nix_max_jobs="$(
            normalize_list "${NIX_MAX_JOBS:-auto}"
          )"
          nix_access_tokens="$(
            normalize_list "${NIX_ACCESS_TOKENS:-}"
          )"

          if [[ -z "$nix_access_tokens" && -n "${GITHUB_ACCESS_TOKEN:-}" ]]; then
            nix_access_tokens="github.com=${GITHUB_ACCESS_TOKEN}"
          fi

          nix_extra_substituters="$(
            normalize_list "${NIX_EXTRA_SUBSTITUTERS:-}"
          )"
          nix_extra_trusted_public_keys="$(
            normalize_list "${NIX_EXTRA_TRUSTED_PUBLIC_KEYS:-}"
          )"

          sudo mkdir -p /etc/nix
          sudo touch /etc/nix/nix.conf
          sudo sed -i \
            -e '/^[[:space:]]*experimental-features[[:space:]]*=/d' \
            -e '/^[[:space:]]*max-jobs[[:space:]]*=/d' \
            -e '/^[[:space:]]*trusted-users[[:space:]]*=/d' \
            -e '/^[[:space:]]*access-tokens[[:space:]]*=/d' \
            -e '/^[[:space:]]*substituters[[:space:]]*=/d' \
            -e '/^[[:space:]]*trusted-public-keys[[:space:]]*=/d' \
            -e '/^[[:space:]]*extra-substituters[[:space:]]*=/d' \
            -e '/^[[:space:]]*extra-trusted-public-keys[[:space:]]*=/d' \
            /etc/nix/nix.conf

          {
            printf '\n'
            printf '%s\n' '# CI Nix settings'
            printf '%s\n' "experimental-features = ${nix_experimental_features}"
            printf '%s\n' "max-jobs = ${nix_max_jobs}"
            printf '%s\n' "trusted-users = ${nix_trusted_users}"

            if [[ -n "$nix_access_tokens" ]]; then
              printf '%s\n' "access-tokens = ${nix_access_tokens}"
            fi

            if [[ -n "$nix_extra_substituters" ]]; then
              printf '%s\n' "extra-substituters = ${nix_extra_substituters}"
            fi

            if [[ -n "$nix_extra_trusted_public_keys" ]]; then
              printf '%s\n' "extra-trusted-public-keys = ${nix_extra_trusted_public_keys}"
            fi
          } | sudo tee -a /etc/nix/nix.conf >/dev/null

          sudo systemctl restart nix-daemon.service

          nix --version
          nix config show experimental-features
          nix config show substituters
          nix config show trusted-public-keys
          nix config show trusted-users

      - name: Apply inherited Nix cache config
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f flake.nix ]]; then
            echo "No flake.nix found; skipping inherited Nix cache config"
            exit 0
          fi

          eval_args=(
            --extra-experimental-features nix-command
            --extra-experimental-features flakes
            --no-write-lock-file
          )

          if ! nix eval --json "${eval_args[@]}" .#lib.x86_64-linux.inheritedNixConfig >/dev/null 2>&1; then
            echo "No inheritedNixConfig output found; skipping inherited Nix cache config"
            exit 0
          fi

          normalize_list() {
            local s="${1:-}"
            s="${s//$'\n'/ }"
            s="${s//$'\t'/ }"
            printf '%s\n' "$s" | awk '{$1=$1; print}'
          }

          flake_output_list() {
            local attr="$1"
            nix eval --raw \
              "${eval_args[@]}" \
              ".#lib.x86_64-linux.inheritedNixConfig.${attr}" \
              --apply 'builtins.concatStringsSep " "'
          }

          read_nix_conf_values() {
            local key="$1"
            awk -v key="$key" '
              $0 ~ "^[[:space:]]*" key "[[:space:]]*=" {
                sub(/^[^=]*=/, "")
                print
              }
            ' /etc/nix/nix.conf
          }

          merge_lists() {
            normalize_list "$*" | awk '
              {
                for (i = 1; i <= NF; i++) {
                  if (!seen[$i]++) {
                    values[++count] = $i
                  }
                }
              }
              END {
                for (i = 1; i <= count; i++) {
                  printf "%s%s", (i == 1 ? "" : " "), values[i]
                }
                if (count > 0) {
                  printf "\n"
                }
              }
            '
          }

          current_extra_substituters="$(normalize_list "$(read_nix_conf_values extra-substituters)")"
          current_extra_trusted_public_keys="$(normalize_list "$(read_nix_conf_values extra-trusted-public-keys)")"

          inherited_substituters="$(normalize_list "$(flake_output_list substituters)")"
          inherited_trusted_public_keys="$(normalize_list "$(flake_output_list trustedPublicKeys)")"

          merged_extra_substituters="$(merge_lists "$current_extra_substituters" "$inherited_substituters")"
          merged_extra_trusted_public_keys="$(merge_lists "$current_extra_trusted_public_keys" "$inherited_trusted_public_keys")"

          sudo sed -i \
            -e '/^[[:space:]]*extra-substituters[[:space:]]*=/d' \
            -e '/^[[:space:]]*extra-trusted-public-keys[[:space:]]*=/d' \
            /etc/nix/nix.conf

          {
            if [[ -n "$merged_extra_substituters" ]]; then
              printf '%s\n' "extra-substituters = ${merged_extra_substituters}"
            fi

            if [[ -n "$merged_extra_trusted_public_keys" ]]; then
              printf '%s\n' "extra-trusted-public-keys = ${merged_extra_trusted_public_keys}"
            fi
          } | sudo tee -a /etc/nix/nix.conf >/dev/null

          sudo systemctl restart nix-daemon.service

          nix config show substituters
          nix config show trusted-public-keys

      - name: Build reports
        run: |
          nix build --accept-flake-config ".#images.${{ inputs.image }}.reports" --print-out-paths --no-link > report-path.txt

          if [[ "${{ inputs.upload_reports }}" == "true" || "${{ inputs.push_image }}" == "true" ]]; then
            cp -R "$(cat report-path.txt)" reports
          fi

      - name: Validate reports
        run: |
          nix build --accept-flake-config ".#checks.x86_64-linux.reports-${{ inputs.image }}" --no-link

      - name: Upload reports
        if: inputs.upload_reports
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ inputs.image }}
          path: reports

      - name: Build OCI image artifact
        run: |
          nix build --accept-flake-config ".#images.${{ inputs.image }}.oci" --print-out-paths --no-link > oci-path.txt

      - name: Validate OCI image artifact
        run: |
          nix build --accept-flake-config ".#checks.x86_64-linux.artifact-image-${{ inputs.image }}" --no-link

      - name: Load OCI image
        run: |
          nix run --accept-flake-config ".#load-${{ inputs.image }}"

      - name: Run smoke plan
        env:
          SMOKE_LOG_DIR: smoke-logs
        run: |
          nix run --accept-flake-config .#run-smoke-plan -- "${{ inputs.image }}"

      - name: Upload smoke logs
        if: always() && inputs.upload_smoke_logs
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-${{ inputs.image }}
          path: smoke-logs
          if-no-files-found: warn

      - name: Login to GHCR
        if: inputs.push_image
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push image
        if: inputs.push_image
        run: |
          image_ref="$(jq -r '.imageRef' reports/ci-plan.json)"
          mapfile -t publish_refs < <(jq -r '.publishRefs[]' reports/ci-plan.json)

          for publish_ref in "${publish_refs[@]}"; do
            if [ "$publish_ref" != "$image_ref" ]; then
              docker tag "$image_ref" "$publish_ref"
            fi

            docker push "$publish_ref"
          done

          docker inspect "$image_ref" --format='{{index .RepoDigests 0}}' > digest.txt

      - name: Upload digest
        if: inputs.push_image
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ inputs.image }}
          path: digest.txt
