name: build-images

on:
  workflow_dispatch:
  push:
    branches: [master]

env:
  CACHIX_CACHE_NAME: hellodword-codex
  CACHIX_PUBLIC_KEY: hellodword-codex.cachix.org-1:0URmcnC9aynWh9+FJ2tf+HQloylGgZzPtrz3sttTTiQ=
  E2E_IMAGES: '["go-web", "rust-web"]'
  E2E_SESSIONS: '["wayland-sway"]'

permissions:
  contents: read

jobs:
  prepare-matrix:
    name: prepare-matrix
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.matrix.outputs.images }}
      e2e: ${{ steps.matrix.outputs.e2e }}
      e2e_enabled: ${{ steps.matrix.outputs.e2e_enabled }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space for Nix
        if: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        shell: bash
        env:
          ROOT_SAFE_HAVEN_MB: "40000"
          ROOT_FALLBACK_SAFE_HAVEN_MB: "12288"
          ROOT_MIN_NIX_VOLUME_MB: "20480"
          MNT_SAFE_HAVEN_MB: "1024"
          NIX_PERMISSION_EDICT: "false"
        run: |
          set -euo pipefail

          if [[ "${GITHUB_ACTIONS:-}" != "true" ]]; then
            echo "This step is intended for GitHub Actions only." >&2
            exit 1
          fi

          if [[ "$(lsb_release -is 2>/dev/null || true)" != "Ubuntu" ]]; then
            echo "This step only supports Ubuntu runners." >&2
            exit 1
          fi

          if [[ -d /nix ]]; then
            echo "/nix already exists; run this step before installing Nix." >&2
            exit 1
          fi

          if [[ ! "$ROOT_SAFE_HAVEN_MB" =~ ^[0-9]+$ ]]; then
            echo "Root safe haven value must be an integer MB value." >&2
            exit 1
          fi

          if [[ ! "$ROOT_FALLBACK_SAFE_HAVEN_MB" =~ ^[0-9]+$ ]]; then
            echo "Root fallback safe haven value must be an integer MB value." >&2
            exit 1
          fi

          if [[ ! "$ROOT_MIN_NIX_VOLUME_MB" =~ ^[0-9]+$ ]]; then
            echo "Root minimum Nix volume value must be an integer MB value." >&2
            exit 1
          fi

          if [[ ! "$MNT_SAFE_HAVEN_MB" =~ ^[0-9]+$ ]]; then
            echo "Mnt safe haven value must be an integer MB value." >&2
            exit 1
          fi

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /opt/az \
            /opt/microsoft \
            /opt/google \
            /usr/local/.ghcup \
            /usr/share/swift \
            || true
          docker system prune -af || true
          df -h

          sudo -n true

          if ! command -v mkfs.btrfs >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y btrfs-progs
          fi

          mkdir -p "${HOME}/.expansion"
          sudo mkdir -p /var/cache/nix /var/lib/nix-storage
          sudo chmod 1777 /var/cache/nix

          diagnose_disk() {
            local label="$1"
            local target
            local tmp_target="${TMPDIR:-/nix/tmp}"
            local -a disk_targets=(/ /mnt /tmp /var/cache/nix "$tmp_target" /nix /nix/tmp /var/lib/docker)

            echo "::group::disk diagnostics: ${label}"
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            printf 'TMPDIR=%s\n' "${TMPDIR:-<unset>}"

            df -hT "${disk_targets[@]}" 2>/dev/null || true
            df -ih "${disk_targets[@]}" 2>/dev/null || true

            for target in "${disk_targets[@]}"; do
              if [[ -e "$target" ]]; then
                findmnt -T "$target" -o TARGET,SOURCE,FSTYPE,SIZE,AVAIL,USED,USE%,OPTIONS 2>/dev/null || true
              else
                printf 'missing path for findmnt: %s\n' "$target"
              fi
            done

            sudo btrfs filesystem usage -T /nix 2>/dev/null || true
            sudo btrfs filesystem df /nix 2>/dev/null || true
            sudo btrfs filesystem show /nix 2>/dev/null || true

            lsblk -f 2>/dev/null || true
            sudo losetup -a 2>/dev/null || true

            sudo du -xh --max-depth=1 /var/cache/nix 2>/dev/null | sort -h | tail -n 30 || true
            sudo du -xh --max-depth=1 /mnt 2>/dev/null | sort -h | tail -n 30 || true
            sudo du -xh --max-depth=1 /var/lib/nix-storage 2>/dev/null | sort -h | tail -n 30 || true
            sudo du -xh --max-depth=1 /nix 2>/dev/null | sort -h | tail -n 30 || true
            sudo du -xh --max-depth=1 /var/lib/docker 2>/dev/null | sort -h | tail -n 30 || true

            if command -v docker >/dev/null 2>&1; then
              docker info --format 'DockerRootDir={{.DockerRootDir}} Driver={{.Driver}}' 2>/dev/null || true
              docker system df -v 2>/dev/null || true
            fi

            echo "::endgroup::"
          }

          diagnose_disk "before carving"

          echo "== Initial disk state =="
          df -h

          initial_label="/"
          initial_avail_path="/"
          initial_image_dir="/var/lib/nix-storage"
          initial_safe_haven_mb="$ROOT_SAFE_HAVEN_MB"

          if [[ -d /mnt && "$(findmnt -T /mnt -no TARGET 2>/dev/null || true)" == "/mnt" ]]; then
            free_mnt="$(df -m --output=avail /mnt | tail -n 1 | tr -d ' ')"
            mnt_min_required=$((MNT_SAFE_HAVEN_MB + 1024))
            echo "Initial free space of /mnt: ${free_mnt}MB"

            if (( free_mnt >= mnt_min_required )); then
              initial_label="/mnt"
              initial_avail_path="/mnt"
              initial_image_dir="/mnt"
              initial_safe_haven_mb="$MNT_SAFE_HAVEN_MB"
            else
              echo "Skipping /mnt initial volume: available ${free_mnt}MB, required at least ${mnt_min_required}MB"
            fi
          else
            echo "No separate /mnt mount found; using / for the initial /nix volume."
          fi

          free_initial="$(df -m --output=avail "$initial_avail_path" | tail -n 1 | tr -d ' ')"
          echo "Initial free space of ${initial_label}: ${free_initial}MB"

          if [[ "$initial_label" == "/" && "$initial_safe_haven_mb" == "$ROOT_SAFE_HAVEN_MB" ]]; then
            root_min_required=$((ROOT_SAFE_HAVEN_MB + 1024))
            root_nix_volume_mb=$((free_initial - ROOT_SAFE_HAVEN_MB))
            if (( free_initial < root_min_required || root_nix_volume_mb < ROOT_MIN_NIX_VOLUME_MB )); then
              echo "Root has ${free_initial}MB free; normal reserve would leave ${root_nix_volume_mb}MB for /nix."
              echo "Normal reserve requires ${root_min_required}MB free and at least ${ROOT_MIN_NIX_VOLUME_MB}MB for /nix."
              echo "Using root fallback safe haven: ${ROOT_FALLBACK_SAFE_HAVEN_MB}MB"
              initial_safe_haven_mb="$ROOT_FALLBACK_SAFE_HAVEN_MB"
            fi
          fi

          min_required=$((initial_safe_haven_mb + 1024))
          if (( free_initial < min_required )); then
            echo "Insufficient free space on ${initial_label}."
            echo "Available: ${free_initial}MB, required: at least ${min_required}MB"
            sudo ls -lah "$initial_avail_path" || true
            exit 1
          fi

          initial_loop="$(sudo losetup --find)"
          initial_loop_num="${initial_loop##*/loop}"
          initial_img="${initial_image_dir}/disk${initial_loop_num}.img"
          initial_size=$((free_initial - initial_safe_haven_mb))

          echo "Creating /nix disk image: ${initial_img} (${initial_size}MB)"
          sudo fallocate -l "${initial_size}M" "${initial_img}"
          sudo losetup "${initial_loop}" "${initial_img}"

          sudo mkfs.btrfs -L nix -d raid0 -m raid0 --nodiscard "${initial_loop}"
          sudo btrfs device scan

          sudo mkdir -p /nix
          sudo mount "${initial_loop}" /nix -o noatime,nobarrier,nodiscard,compress=zstd:1,space_cache=v2,commit=120
          sudo mkdir -p /nix/build /nix/tmp
          sudo chmod 1777 /nix/tmp

          free_root="$(df -m --output=avail / | tail -n 1 | tr -d ' ')"
          root_expand_min_required=$((ROOT_SAFE_HAVEN_MB + 2048))
          if (( free_root > root_expand_min_required )); then
            root_loop="$(sudo losetup --find)"
            root_loop_num="${root_loop##*/loop}"
            root_img="/var/lib/nix-storage/root-disk${root_loop_num}.img"
            root_size=$((free_root - ROOT_SAFE_HAVEN_MB))

            echo "Adding root expansion disk: ${root_img} (${root_size}MB)"
            sudo fallocate -l "${root_size}M" "${root_img}"
            sudo losetup "${root_loop}" "${root_img}"
            sudo btrfs device add --nodiscard "${root_loop}" /nix
            sudo btrfs balance start -dusage=50 /nix
            echo "Disk space has been carved out" | tee "${HOME}/.expansion/carve_done"
          else
            echo "Skipping root expansion: / has ${free_root}MB free; need more than ${root_expand_min_required}MB."
          fi

          diagnose_disk "after /nix mount"

          if [[ "${NIX_PERMISSION_EDICT}" == "true" ]]; then
            sudo chown -R "$(id --user)":"$(id --group)" /nix
          fi

          export TMPDIR=/nix/tmp
          echo "TMPDIR=/nix/tmp" >> "${GITHUB_ENV}"
          diagnose_disk "after tmpdir setup"

          echo "Initial volume created" | tee "${HOME}/.expansion/holster_done"

          diagnose_disk "after carving"

          echo "== Final disk state =="
          df -h

          echo "== BTRFS devices backing /nix =="
          sudo btrfs filesystem show /nix || sudo btrfs filesystem show

      - name: Install and configure Nix
        shell: bash
        env:
          GITHUB_ACCESS_TOKEN: ${{ github.token }}
          NIX_EXTRA_SUBSTITUTERS: |
            https://${{ env.CACHIX_CACHE_NAME }}.cachix.org
          NIX_EXTRA_TRUSTED_PUBLIC_KEYS: |
            ${{ env.CACHIX_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y curl ca-certificates xz-utils

          curl -fsSL https://nixos.org/nix/install | sh -s -- --daemon
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
          echo "NIX_REMOTE=daemon" >> "$GITHUB_ENV"

          export NIX_REMOTE=daemon
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh

          normalize_list() {
            local s="${1:-}"
            s="${s//$'\n'/ }"
            s="${s//$'\t'/ }"
            printf '%s\n' "$s" | awk '{$1=$1; print}'
          }

          current_user="$(id -un)"

          nix_experimental_features="$(
            normalize_list "${NIX_EXPERIMENTAL_FEATURES:-nix-command flakes}"
          )"
          nix_trusted_users="$(
            normalize_list "${NIX_TRUSTED_USERS:-root ${current_user}}"
          )"
          nix_max_jobs="$(
            normalize_list "${NIX_MAX_JOBS:-auto}"
          )"
          nix_access_tokens="$(
            normalize_list "${NIX_ACCESS_TOKENS:-}"
          )"

          if [[ -z "$nix_access_tokens" && -n "${GITHUB_ACCESS_TOKEN:-}" ]]; then
            nix_access_tokens="github.com=${GITHUB_ACCESS_TOKEN}"
          fi

          nix_extra_substituters="$(
            normalize_list "${NIX_EXTRA_SUBSTITUTERS:-}"
          )"
          nix_extra_trusted_public_keys="$(
            normalize_list "${NIX_EXTRA_TRUSTED_PUBLIC_KEYS:-}"
          )"

          sudo mkdir -p /etc/nix
          sudo touch /etc/nix/nix.conf
          sudo sed -i \
            -e '/^[[:space:]]*experimental-features[[:space:]]*=/d' \
            -e '/^[[:space:]]*build-dir[[:space:]]*=/d' \
            -e '/^[[:space:]]*max-jobs[[:space:]]*=/d' \
            -e '/^[[:space:]]*trusted-users[[:space:]]*=/d' \
            -e '/^[[:space:]]*access-tokens[[:space:]]*=/d' \
            -e '/^[[:space:]]*substituters[[:space:]]*=/d' \
            -e '/^[[:space:]]*trusted-public-keys[[:space:]]*=/d' \
            -e '/^[[:space:]]*extra-substituters[[:space:]]*=/d' \
            -e '/^[[:space:]]*extra-trusted-public-keys[[:space:]]*=/d' \
            /etc/nix/nix.conf

          {
            printf '\n'
            printf '%s\n' '# CI Nix settings'
            printf '%s\n' "experimental-features = ${nix_experimental_features}"
            printf '%s\n' 'build-dir = /nix/build'
            printf '%s\n' "max-jobs = ${nix_max_jobs}"
            printf '%s\n' "trusted-users = ${nix_trusted_users}"

            if [[ -n "$nix_access_tokens" ]]; then
              printf '%s\n' "access-tokens = ${nix_access_tokens}"
            fi

            if [[ -n "$nix_extra_substituters" ]]; then
              printf '%s\n' "extra-substituters = ${nix_extra_substituters}"
            fi

            if [[ -n "$nix_extra_trusted_public_keys" ]]; then
              printf '%s\n' "extra-trusted-public-keys = ${nix_extra_trusted_public_keys}"
            fi
          } | sudo tee -a /etc/nix/nix.conf >/dev/null

          sudo systemctl restart nix-daemon.service

          nix --version
          nix config show experimental-features
          nix config show build-dir
          nix config show substituters
          nix config show trusted-public-keys
          nix config show trusted-users

      - name: Apply inherited Nix cache config
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f flake.nix ]]; then
            echo "No flake.nix found; skipping inherited Nix cache config"
            exit 0
          fi

          eval_args=(
            --extra-experimental-features nix-command
            --extra-experimental-features flakes
            --no-write-lock-file
          )

          if ! nix eval --json "${eval_args[@]}" .#lib.x86_64-linux.inheritedNixConfig >/dev/null 2>&1; then
            echo "No inheritedNixConfig output found; skipping inherited Nix cache config"
            exit 0
          fi

          normalize_list() {
            local s="${1:-}"
            s="${s//$'\n'/ }"
            s="${s//$'\t'/ }"
            printf '%s\n' "$s" | awk '{$1=$1; print}'
          }

          flake_output_list() {
            local attr="$1"
            nix eval --raw \
              "${eval_args[@]}" \
              ".#lib.x86_64-linux.inheritedNixConfig.${attr}" \
              --apply 'builtins.concatStringsSep " "'
          }

          read_nix_conf_values() {
            local key="$1"
            awk -v key="$key" '
              $0 ~ "^[[:space:]]*" key "[[:space:]]*=" {
                sub(/^[^=]*=/, "")
                print
              }
            ' /etc/nix/nix.conf
          }

          merge_lists() {
            normalize_list "$*" | awk '
              {
                for (i = 1; i <= NF; i++) {
                  if (!seen[$i]++) {
                    values[++count] = $i
                  }
                }
              }
              END {
                for (i = 1; i <= count; i++) {
                  printf "%s%s", (i == 1 ? "" : " "), values[i]
                }
                if (count > 0) {
                  printf "\n"
                }
              }
            '
          }

          current_extra_substituters="$(normalize_list "$(read_nix_conf_values extra-substituters)")"
          current_extra_trusted_public_keys="$(normalize_list "$(read_nix_conf_values extra-trusted-public-keys)")"

          inherited_substituters="$(normalize_list "$(flake_output_list substituters)")"
          inherited_trusted_public_keys="$(normalize_list "$(flake_output_list trustedPublicKeys)")"

          merged_extra_substituters="$(merge_lists "$current_extra_substituters" "$inherited_substituters")"
          merged_extra_trusted_public_keys="$(merge_lists "$current_extra_trusted_public_keys" "$inherited_trusted_public_keys")"

          sudo sed -i \
            -e '/^[[:space:]]*extra-substituters[[:space:]]*=/d' \
            -e '/^[[:space:]]*extra-trusted-public-keys[[:space:]]*=/d' \
            /etc/nix/nix.conf

          {
            if [[ -n "$merged_extra_substituters" ]]; then
              printf '%s\n' "extra-substituters = ${merged_extra_substituters}"
            fi

            if [[ -n "$merged_extra_trusted_public_keys" ]]; then
              printf '%s\n' "extra-trusted-public-keys = ${merged_extra_trusted_public_keys}"
            fi
          } | sudo tee -a /etc/nix/nix.conf >/dev/null

          sudo systemctl restart nix-daemon.service

          nix config show substituters
          nix config show trusted-public-keys

      - name: Read CI matrix from Nix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          images="$(
            nix eval --accept-flake-config --json .#lib.x86_64-linux.imageNames \
              | tr -d '\n'
          )"
          e2e="$(
            python3 - <<'PY'
          import json
          import os

          images = json.loads(os.environ["E2E_IMAGES"])
          sessions = json.loads(os.environ["E2E_SESSIONS"])
          matrix = [
              {
                  "image": image,
                  "session": session,
                  "attr": f"e2e-vscode-{image}-{session}",
              }
              for image in images
              for session in sessions
          ]
          print(json.dumps(matrix, separators=(",", ":")))
          PY
          )"

          if [[ -z "$images" || "$images" == "[]" ]]; then
            echo "CI image matrix is empty" >&2
            exit 1
          fi

          if [[ -z "$e2e" || "$e2e" == "[]" ]]; then
            e2e_enabled=false
            e2e='[{"image":"__disabled__","session":"__disabled__","attr":"__disabled__"}]'
          else
            e2e_enabled=true
          fi

          {
            printf 'images=%s\n' "$images"
            printf 'e2e=%s\n' "$e2e"
            printf 'e2e_enabled=%s\n' "$e2e_enabled"
          } >> "$GITHUB_OUTPUT"

          printf 'images=%s\n' "$images"
          printf 'e2e_enabled=%s\n' "$e2e_enabled"
          printf 'e2e=%s\n' "$e2e"

  build:
    name: build-${{ matrix.image }}
    needs: prepare-matrix
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prepare-matrix.outputs.images) }}
    concurrency:
      group: devcontainers-nix-build-image-${{ matrix.image }}
      cancel-in-progress: true
    uses: ./.github/workflows/_validate-image.yml
    with:
      image: ${{ matrix.image }}
      upload_reports: true
      upload_smoke_logs: true
      push_image: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

  e2e:
    name: e2e-${{ matrix.image }}-${{ matrix.session }}
    needs:
      - prepare-matrix
      - build
    if: ${{ needs.prepare-matrix.outputs.e2e_enabled == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.e2e) }}
    concurrency:
      group: devcontainers-nix-e2e-${{ matrix.image }}-${{ matrix.session }}
      cancel-in-progress: true

    steps:
      - name: Free disk space for Nix
        if: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        shell: bash
        env:
          ROOT_SAFE_HAVEN_MB: "40000"
          ROOT_FALLBACK_SAFE_HAVEN_MB: "12288"
          ROOT_MIN_NIX_VOLUME_MB: "20480"
          MNT_SAFE_HAVEN_MB: "1024"
          NIX_PERMISSION_EDICT: "false"
        run: |
          set -euo pipefail

          if [[ "${GITHUB_ACTIONS:-}" != "true" ]]; then
            echo "This step is intended for GitHub Actions only." >&2
            exit 1
          fi

          if [[ "$(lsb_release -is 2>/dev/null || true)" != "Ubuntu" ]]; then
            echo "This step only supports Ubuntu runners." >&2
            exit 1
          fi

          if [[ -d /nix ]]; then
            echo "/nix already exists; run this step before installing Nix." >&2
            exit 1
          fi

          if [[ ! "$ROOT_SAFE_HAVEN_MB" =~ ^[0-9]+$ ]]; then
            echo "Root safe haven value must be an integer MB value." >&2
            exit 1
          fi

          if [[ ! "$ROOT_FALLBACK_SAFE_HAVEN_MB" =~ ^[0-9]+$ ]]; then
            echo "Root fallback safe haven value must be an integer MB value." >&2
            exit 1
          fi

          if [[ ! "$ROOT_MIN_NIX_VOLUME_MB" =~ ^[0-9]+$ ]]; then
            echo "Root minimum Nix volume value must be an integer MB value." >&2
            exit 1
          fi

          if [[ ! "$MNT_SAFE_HAVEN_MB" =~ ^[0-9]+$ ]]; then
            echo "Mnt safe haven value must be an integer MB value." >&2
            exit 1
          fi

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /opt/az \
            /opt/microsoft \
            /opt/google \
            /usr/local/.ghcup \
            /usr/share/swift \
            || true
          docker system prune -af || true
          df -h

          sudo -n true

          if ! command -v mkfs.btrfs >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y btrfs-progs
          fi

          mkdir -p "${HOME}/.expansion"
          sudo mkdir -p /var/cache/nix /var/lib/nix-storage
          sudo chmod 1777 /var/cache/nix

          diagnose_disk() {
            local label="$1"
            local target
            local tmp_target="${TMPDIR:-/nix/tmp}"
            local -a disk_targets=(/ /mnt /tmp /var/cache/nix "$tmp_target" /nix /nix/tmp /var/lib/docker)

            echo "::group::disk diagnostics: ${label}"
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            printf 'TMPDIR=%s\n' "${TMPDIR:-<unset>}"

            df -hT "${disk_targets[@]}" 2>/dev/null || true
            df -ih "${disk_targets[@]}" 2>/dev/null || true

            for target in "${disk_targets[@]}"; do
              if [[ -e "$target" ]]; then
                findmnt -T "$target" -o TARGET,SOURCE,FSTYPE,SIZE,AVAIL,USED,USE%,OPTIONS 2>/dev/null || true
              else
                printf 'missing path for findmnt: %s\n' "$target"
              fi
            done

            sudo btrfs filesystem usage -T /nix 2>/dev/null || true
            sudo btrfs filesystem df /nix 2>/dev/null || true
            sudo btrfs filesystem show /nix 2>/dev/null || true

            lsblk -f 2>/dev/null || true
            sudo losetup -a 2>/dev/null || true

            sudo du -xh --max-depth=1 /var/cache/nix 2>/dev/null | sort -h | tail -n 30 || true
            sudo du -xh --max-depth=1 /mnt 2>/dev/null | sort -h | tail -n 30 || true
            sudo du -xh --max-depth=1 /var/lib/nix-storage 2>/dev/null | sort -h | tail -n 30 || true
            sudo du -xh --max-depth=1 /nix 2>/dev/null | sort -h | tail -n 30 || true
            sudo du -xh --max-depth=1 /var/lib/docker 2>/dev/null | sort -h | tail -n 30 || true

            if command -v docker >/dev/null 2>&1; then
              docker info --format 'DockerRootDir={{.DockerRootDir}} Driver={{.Driver}}' 2>/dev/null || true
              docker system df -v 2>/dev/null || true
            fi

            echo "::endgroup::"
          }

          diagnose_disk "before carving"

          echo "== Initial disk state =="
          df -h

          initial_label="/"
          initial_avail_path="/"
          initial_image_dir="/var/lib/nix-storage"
          initial_safe_haven_mb="$ROOT_SAFE_HAVEN_MB"

          if [[ -d /mnt && "$(findmnt -T /mnt -no TARGET 2>/dev/null || true)" == "/mnt" ]]; then
            free_mnt="$(df -m --output=avail /mnt | tail -n 1 | tr -d ' ')"
            mnt_min_required=$((MNT_SAFE_HAVEN_MB + 1024))
            echo "Initial free space of /mnt: ${free_mnt}MB"

            if (( free_mnt >= mnt_min_required )); then
              initial_label="/mnt"
              initial_avail_path="/mnt"
              initial_image_dir="/mnt"
              initial_safe_haven_mb="$MNT_SAFE_HAVEN_MB"
            else
              echo "Skipping /mnt initial volume: available ${free_mnt}MB, required at least ${mnt_min_required}MB"
            fi
          else
            echo "No separate /mnt mount found; using / for the initial /nix volume."
          fi

          free_initial="$(df -m --output=avail "$initial_avail_path" | tail -n 1 | tr -d ' ')"
          echo "Initial free space of ${initial_label}: ${free_initial}MB"

          if [[ "$initial_label" == "/" && "$initial_safe_haven_mb" == "$ROOT_SAFE_HAVEN_MB" ]]; then
            root_min_required=$((ROOT_SAFE_HAVEN_MB + 1024))
            root_nix_volume_mb=$((free_initial - ROOT_SAFE_HAVEN_MB))
            if (( free_initial < root_min_required || root_nix_volume_mb < ROOT_MIN_NIX_VOLUME_MB )); then
              echo "Root has ${free_initial}MB free; normal reserve would leave ${root_nix_volume_mb}MB for /nix."
              echo "Normal reserve requires ${root_min_required}MB free and at least ${ROOT_MIN_NIX_VOLUME_MB}MB for /nix."
              echo "Using root fallback safe haven: ${ROOT_FALLBACK_SAFE_HAVEN_MB}MB"
              initial_safe_haven_mb="$ROOT_FALLBACK_SAFE_HAVEN_MB"
            fi
          fi

          min_required=$((initial_safe_haven_mb + 1024))
          if (( free_initial < min_required )); then
            echo "Insufficient free space on ${initial_label}."
            echo "Available: ${free_initial}MB, required: at least ${min_required}MB"
            sudo ls -lah "$initial_avail_path" || true
            exit 1
          fi

          initial_loop="$(sudo losetup --find)"
          initial_loop_num="${initial_loop##*/loop}"
          initial_img="${initial_image_dir}/disk${initial_loop_num}.img"
          initial_size=$((free_initial - initial_safe_haven_mb))

          echo "Creating /nix disk image: ${initial_img} (${initial_size}MB)"
          sudo fallocate -l "${initial_size}M" "${initial_img}"
          sudo losetup "${initial_loop}" "${initial_img}"

          sudo mkfs.btrfs -L nix -d raid0 -m raid0 --nodiscard "${initial_loop}"
          sudo btrfs device scan

          sudo mkdir -p /nix
          sudo mount "${initial_loop}" /nix -o noatime,nobarrier,nodiscard,compress=zstd:1,space_cache=v2,commit=120
          sudo mkdir -p /nix/build /nix/tmp
          sudo chmod 1777 /nix/tmp

          free_root="$(df -m --output=avail / | tail -n 1 | tr -d ' ')"
          root_expand_min_required=$((ROOT_SAFE_HAVEN_MB + 2048))
          if (( free_root > root_expand_min_required )); then
            root_loop="$(sudo losetup --find)"
            root_loop_num="${root_loop##*/loop}"
            root_img="/var/lib/nix-storage/root-disk${root_loop_num}.img"
            root_size=$((free_root - ROOT_SAFE_HAVEN_MB))

            echo "Adding root expansion disk: ${root_img} (${root_size}MB)"
            sudo fallocate -l "${root_size}M" "${root_img}"
            sudo losetup "${root_loop}" "${root_img}"
            sudo btrfs device add --nodiscard "${root_loop}" /nix
            sudo btrfs balance start -dusage=50 /nix
            echo "Disk space has been carved out" | tee "${HOME}/.expansion/carve_done"
          else
            echo "Skipping root expansion: / has ${free_root}MB free; need more than ${root_expand_min_required}MB."
          fi

          diagnose_disk "after /nix mount"

          if [[ "${NIX_PERMISSION_EDICT}" == "true" ]]; then
            sudo chown -R "$(id --user)":"$(id --group)" /nix
          fi

          export TMPDIR=/nix/tmp
          echo "TMPDIR=/nix/tmp" >> "${GITHUB_ENV}"
          diagnose_disk "after tmpdir setup"

          echo "Initial volume created" | tee "${HOME}/.expansion/holster_done"

          diagnose_disk "after carving"

          echo "== Final disk state =="
          df -h

          echo "== BTRFS devices backing /nix =="
          sudo btrfs filesystem show /nix || sudo btrfs filesystem show

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix with official installer
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y xz-utils
          curl -L https://nixos.org/nix/install | sh -s -- --daemon
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
          echo "NIX_REMOTE=daemon" >> "$GITHUB_ENV"
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix --version

      - name: Configure Nix
        shell: bash
        run: |
          set -euxo pipefail
          sudo sed -i \
            -e '/^experimental-features[[:space:]]*=/d' \
            -e '/^build-dir[[:space:]]*=/d' \
            -e '/^max-jobs[[:space:]]*=/d' \
            -e '/^substituters[[:space:]]*=/d' \
            -e '/^trusted-public-keys[[:space:]]*=/d' \
            -e '/^trusted-users[[:space:]]*=/d' \
            /etc/nix/nix.conf

          printf '%s\n' \
            "experimental-features = nix-command flakes" \
            "build-dir = /nix/build" \
            "max-jobs = auto" \
            "trusted-users = root ${USER}" \
            "extra-substituters = https://${CACHIX_CACHE_NAME}.cachix.org" \
            "extra-trusted-public-keys = ${CACHIX_PUBLIC_KEY}" \
            | sudo tee -a /etc/nix/nix.conf

          sudo systemctl restart nix-daemon
          nix config show experimental-features
          nix config show build-dir
          nix config show substituters

      - name: Enable KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "/dev/kvm is missing; e2e requires a KVM-capable runner" >&2
            exit 1
          fi

          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Run e2e test
        run: |
          set -euo pipefail

          attr=".#e2e.x86_64-linux.${{ matrix.attr }}"

          drv_path="$(
            nix path-info \
              --accept-flake-config \
              --derivation \
              "$attr"
          )"

          printf '%s\n' "$drv_path" > e2e-drv-path.txt

          set +e
          NO_COLOR=1 TERM=dumb nix build \
            --accept-flake-config \
            "$attr" \
            --print-out-paths \
            --no-link \
            >e2e-output-path.txt \
            2>e2e-build.stderr.log
          status="$?"
          set -e

          if [ "$status" -eq 0 ]; then
            output_path="$(tail -n1 e2e-output-path.txt)"
            test -n "$output_path"

            mkdir -p e2e-output
            if [ -d "$output_path" ]; then
              cp -R "$output_path"/. e2e-output/
            else
              cp -R "$output_path" e2e-output/
            fi

            exit 0
          fi

          mkdir -p e2e-logs
          cp e2e-build.stderr.log e2e-logs/

          NO_COLOR=1 TERM=dumb nix \
            --extra-experimental-features nix-command \
            --extra-experimental-features flakes \
            --log-format raw \
            log "$drv_path" \
            >"e2e-logs/$(basename "$drv_path").log" \
            2>&1 || true

          sed -r -i 's/\x1B\[[0-9;]*[mK]//g' e2e-logs/*.log

          exit "$status"

      - name: Upload e2e output
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output-${{ matrix.image }}-${{ matrix.session }}
          path: e2e-output
          if-no-files-found: error

      - name: Upload e2e nix logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-nix-logs-${{ matrix.image }}-${{ matrix.session }}
          path: e2e-logs
          if-no-files-found: warn
