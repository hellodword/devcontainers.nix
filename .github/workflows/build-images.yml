name: build-images

on:
  workflow_dispatch:
  push:
    branches: [master]

env:
  CACHIX_CACHE_NAME: hellodword-codex
  CACHIX_PUBLIC_KEY: hellodword-codex.cachix.org-1:0URmcnC9aynWh9+FJ2tf+HQloylGgZzPtrz3sttTTiQ=
  E2E_IMAGES: '["go-web", "rust-web"]'
  E2E_SESSIONS: '["wayland-sway"]'

permissions:
  contents: read

jobs:
  prepare-matrix:
    name: prepare-matrix
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.matrix.outputs.images }}
      e2e: ${{ steps.matrix.outputs.e2e }}
      e2e_enabled: ${{ steps.matrix.outputs.e2e_enabled }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          docker system prune -af || true
          df -h

      - name: Install and configure Nix
        shell: bash
        env:
          GITHUB_ACCESS_TOKEN: ${{ github.token }}
          NIX_EXTRA_SUBSTITUTERS: |
            https://${{ env.CACHIX_CACHE_NAME }}.cachix.org
          NIX_EXTRA_TRUSTED_PUBLIC_KEYS: |
            ${{ env.CACHIX_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y curl ca-certificates xz-utils

          curl -fsSL https://nixos.org/nix/install | sh -s -- --daemon
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
          echo "NIX_REMOTE=daemon" >> "$GITHUB_ENV"

          export NIX_REMOTE=daemon
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh

          normalize_list() {
            local s="${1:-}"
            s="${s//$'\n'/ }"
            s="${s//$'\t'/ }"
            printf '%s\n' "$s" | awk '{$1=$1; print}'
          }

          current_user="$(id -un)"

          nix_experimental_features="$(
            normalize_list "${NIX_EXPERIMENTAL_FEATURES:-nix-command flakes}"
          )"
          nix_trusted_users="$(
            normalize_list "${NIX_TRUSTED_USERS:-root ${current_user}}"
          )"
          nix_max_jobs="$(
            normalize_list "${NIX_MAX_JOBS:-auto}"
          )"
          nix_access_tokens="$(
            normalize_list "${NIX_ACCESS_TOKENS:-}"
          )"

          if [[ -z "$nix_access_tokens" && -n "${GITHUB_ACCESS_TOKEN:-}" ]]; then
            nix_access_tokens="github.com=${GITHUB_ACCESS_TOKEN}"
          fi

          nix_extra_substituters="$(
            normalize_list "${NIX_EXTRA_SUBSTITUTERS:-}"
          )"
          nix_extra_trusted_public_keys="$(
            normalize_list "${NIX_EXTRA_TRUSTED_PUBLIC_KEYS:-}"
          )"

          sudo mkdir -p /etc/nix
          sudo touch /etc/nix/nix.conf
          sudo sed -i \
            -e '/^[[:space:]]*experimental-features[[:space:]]*=/d' \
            -e '/^[[:space:]]*max-jobs[[:space:]]*=/d' \
            -e '/^[[:space:]]*trusted-users[[:space:]]*=/d' \
            -e '/^[[:space:]]*access-tokens[[:space:]]*=/d' \
            -e '/^[[:space:]]*substituters[[:space:]]*=/d' \
            -e '/^[[:space:]]*trusted-public-keys[[:space:]]*=/d' \
            -e '/^[[:space:]]*extra-substituters[[:space:]]*=/d' \
            -e '/^[[:space:]]*extra-trusted-public-keys[[:space:]]*=/d' \
            /etc/nix/nix.conf

          {
            printf '\n'
            printf '%s\n' '# CI Nix settings'
            printf '%s\n' "experimental-features = ${nix_experimental_features}"
            printf '%s\n' "max-jobs = ${nix_max_jobs}"
            printf '%s\n' "trusted-users = ${nix_trusted_users}"

            if [[ -n "$nix_access_tokens" ]]; then
              printf '%s\n' "access-tokens = ${nix_access_tokens}"
            fi

            if [[ -n "$nix_extra_substituters" ]]; then
              printf '%s\n' "extra-substituters = ${nix_extra_substituters}"
            fi

            if [[ -n "$nix_extra_trusted_public_keys" ]]; then
              printf '%s\n' "extra-trusted-public-keys = ${nix_extra_trusted_public_keys}"
            fi
          } | sudo tee -a /etc/nix/nix.conf >/dev/null

          sudo systemctl restart nix-daemon.service

          nix --version
          nix config show experimental-features
          nix config show substituters
          nix config show trusted-public-keys
          nix config show trusted-users

      - name: Apply inherited Nix cache config
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f flake.nix ]]; then
            echo "No flake.nix found; skipping inherited Nix cache config"
            exit 0
          fi

          eval_args=(
            --extra-experimental-features nix-command
            --extra-experimental-features flakes
            --no-write-lock-file
          )

          if ! nix eval --json "${eval_args[@]}" .#lib.x86_64-linux.inheritedNixConfig >/dev/null 2>&1; then
            echo "No inheritedNixConfig output found; skipping inherited Nix cache config"
            exit 0
          fi

          normalize_list() {
            local s="${1:-}"
            s="${s//$'\n'/ }"
            s="${s//$'\t'/ }"
            printf '%s\n' "$s" | awk '{$1=$1; print}'
          }

          flake_output_list() {
            local attr="$1"
            nix eval --raw \
              "${eval_args[@]}" \
              ".#lib.x86_64-linux.inheritedNixConfig.${attr}" \
              --apply 'builtins.concatStringsSep " "'
          }

          read_nix_conf_values() {
            local key="$1"
            awk -v key="$key" '
              $0 ~ "^[[:space:]]*" key "[[:space:]]*=" {
                sub(/^[^=]*=/, "")
                print
              }
            ' /etc/nix/nix.conf
          }

          merge_lists() {
            normalize_list "$*" | awk '
              {
                for (i = 1; i <= NF; i++) {
                  if (!seen[$i]++) {
                    values[++count] = $i
                  }
                }
              }
              END {
                for (i = 1; i <= count; i++) {
                  printf "%s%s", (i == 1 ? "" : " "), values[i]
                }
                if (count > 0) {
                  printf "\n"
                }
              }
            '
          }

          current_extra_substituters="$(normalize_list "$(read_nix_conf_values extra-substituters)")"
          current_extra_trusted_public_keys="$(normalize_list "$(read_nix_conf_values extra-trusted-public-keys)")"

          inherited_substituters="$(normalize_list "$(flake_output_list substituters)")"
          inherited_trusted_public_keys="$(normalize_list "$(flake_output_list trustedPublicKeys)")"

          merged_extra_substituters="$(merge_lists "$current_extra_substituters" "$inherited_substituters")"
          merged_extra_trusted_public_keys="$(merge_lists "$current_extra_trusted_public_keys" "$inherited_trusted_public_keys")"

          sudo sed -i \
            -e '/^[[:space:]]*extra-substituters[[:space:]]*=/d' \
            -e '/^[[:space:]]*extra-trusted-public-keys[[:space:]]*=/d' \
            /etc/nix/nix.conf

          {
            if [[ -n "$merged_extra_substituters" ]]; then
              printf '%s\n' "extra-substituters = ${merged_extra_substituters}"
            fi

            if [[ -n "$merged_extra_trusted_public_keys" ]]; then
              printf '%s\n' "extra-trusted-public-keys = ${merged_extra_trusted_public_keys}"
            fi
          } | sudo tee -a /etc/nix/nix.conf >/dev/null

          sudo systemctl restart nix-daemon.service

          nix config show substituters
          nix config show trusted-public-keys

      - name: Read CI matrix from Nix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          images="$(
            nix eval --accept-flake-config --json .#lib.x86_64-linux.imageNames \
              | tr -d '\n'
          )"
          e2e="$(
            python3 - <<'PY'
          import json
          import os

          images = json.loads(os.environ["E2E_IMAGES"])
          sessions = json.loads(os.environ["E2E_SESSIONS"])
          matrix = [
              {
                  "image": image,
                  "session": session,
                  "attr": f"e2e-vscode-{image}-{session}",
              }
              for image in images
              for session in sessions
          ]
          print(json.dumps(matrix, separators=(",", ":")))
          PY
          )"

          if [[ -z "$images" || "$images" == "[]" ]]; then
            echo "CI image matrix is empty" >&2
            exit 1
          fi

          if [[ -z "$e2e" || "$e2e" == "[]" ]]; then
            e2e_enabled=false
            e2e='[{"image":"__disabled__","session":"__disabled__","attr":"__disabled__"}]'
          else
            e2e_enabled=true
          fi

          {
            printf 'images=%s\n' "$images"
            printf 'e2e=%s\n' "$e2e"
            printf 'e2e_enabled=%s\n' "$e2e_enabled"
          } >> "$GITHUB_OUTPUT"

          printf 'images=%s\n' "$images"
          printf 'e2e_enabled=%s\n' "$e2e_enabled"
          printf 'e2e=%s\n' "$e2e"

  build:
    name: build-${{ matrix.image }}
    needs: prepare-matrix
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prepare-matrix.outputs.images) }}
    concurrency:
      group: devcontainers-nix-build-image-${{ matrix.image }}
      cancel-in-progress: true
    uses: ./.github/workflows/_validate-image.yml
    with:
      image: ${{ matrix.image }}
      upload_reports: true
      upload_smoke_logs: true
      push_image: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

  e2e:
    name: e2e-${{ matrix.image }}-${{ matrix.session }}
    needs:
      - prepare-matrix
      - build
    if: ${{ needs.prepare-matrix.outputs.e2e_enabled == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.e2e) }}
    concurrency:
      group: devcontainers-nix-e2e-${{ matrix.image }}-${{ matrix.session }}
      cancel-in-progress: true

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          docker system prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix with official installer
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y xz-utils
          curl -L https://nixos.org/nix/install | sh -s -- --daemon
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
          echo "NIX_REMOTE=daemon" >> "$GITHUB_ENV"
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix --version

      - name: Configure Nix
        shell: bash
        run: |
          set -euxo pipefail
          sudo sed -i \
            -e '/^experimental-features[[:space:]]*=/d' \
            -e '/^max-jobs[[:space:]]*=/d' \
            -e '/^substituters[[:space:]]*=/d' \
            -e '/^trusted-public-keys[[:space:]]*=/d' \
            -e '/^trusted-users[[:space:]]*=/d' \
            /etc/nix/nix.conf

          printf '%s\n' \
            "experimental-features = nix-command flakes" \
            "max-jobs = auto" \
            "trusted-users = root ${USER}" \
            "extra-substituters = https://${CACHIX_CACHE_NAME}.cachix.org" \
            "extra-trusted-public-keys = ${CACHIX_PUBLIC_KEY}" \
            | sudo tee -a /etc/nix/nix.conf

          sudo systemctl restart nix-daemon
          nix config show experimental-features
          nix config show substituters

      - name: Enable KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "/dev/kvm is missing; e2e requires a KVM-capable runner" >&2
            exit 1
          fi

          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Run e2e test
        run: |
          set -euo pipefail

          attr=".#e2e.x86_64-linux.${{ matrix.attr }}"

          drv_path="$(
            nix path-info \
              --accept-flake-config \
              --derivation \
              "$attr"
          )"

          printf '%s\n' "$drv_path" > e2e-drv-path.txt

          set +e
          NO_COLOR=1 TERM=dumb nix build \
            --accept-flake-config \
            "$attr" \
            --print-out-paths \
            --no-link \
            >e2e-output-path.txt \
            2>e2e-build.stderr.log
          status="$?"
          set -e

          if [ "$status" -eq 0 ]; then
            output_path="$(tail -n1 e2e-output-path.txt)"
            test -n "$output_path"

            mkdir -p e2e-output
            if [ -d "$output_path" ]; then
              cp -R "$output_path"/. e2e-output/
            else
              cp -R "$output_path" e2e-output/
            fi

            exit 0
          fi

          mkdir -p e2e-logs
          cp e2e-build.stderr.log e2e-logs/

          NO_COLOR=1 TERM=dumb nix \
            --extra-experimental-features nix-command \
            --extra-experimental-features flakes \
            --log-format raw \
            log "$drv_path" \
            >"e2e-logs/$(basename "$drv_path").log" \
            2>&1 || true

          sed -r -i 's/\x1B\[[0-9;]*[mK]//g' e2e-logs/*.log

          exit "$status"

      - name: Upload e2e output
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output-${{ matrix.image }}-${{ matrix.session }}
          path: e2e-output
          if-no-files-found: error

      - name: Upload e2e nix logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-nix-logs-${{ matrix.image }}-${{ matrix.session }}
          path: e2e-logs
          if-no-files-found: warn
