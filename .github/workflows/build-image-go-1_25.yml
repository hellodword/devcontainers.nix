

name: build-image-go-1_25

on:
  workflow_dispatch:
  push:
    branches: [ master ]

concurrency:
  group: build-image-go-1_25
  cancel-in-progress: true

env:
  CACHIX_CACHE_NAME: hellodword-codex
  CACHIX_PUBLIC_KEY: hellodword-codex.cachix.org-1:0URmcnC9aynWh9+FJ2tf+HQloylGgZzPtrz3sttTTiQ=

jobs:
  build:
    name: build-go-1_25
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          docker system prune -af || true
          df -h

      # https://github.com/orgs/community/discussions/42479#discussioncomment-4484937
      # https://github.com/wph95/opentelemetry-demo-webstore/blob/ae08811157db7ba590a7c8dd6faa2cb9d1473bef/.github/workflows/release.yml#L24-L29
      # limit docker push image concurrency to 1
      # to avoid github package return 429 ratelimit error
      - name: Set docker upload concurrent
        run: |
          echo $'{"max-concurrent-downloads": 50, "max-concurrent-uploads": 2}' | sudo dd status=none of=/etc/docker/daemon.json
          sudo service docker restart

      # https://discourse.nixos.org/t/building-docker-image-in-github-actions-leads-to-skopeo-related-issues/40636/4
      - name: Fix dockerTools.pullImage issue
        run: |
          sudo chmod 755 /run/containers
          sudo mkdir -p "/run/containers/$(id -u runner)"
          sudo chown runner: "/run/containers/$(id -u runner)"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install and configure Nix
        shell: bash
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIX_EXTRA_SUBSTITUTERS: |
            https://${{ env.CACHIX_CACHE_NAME }}.cachix.org
            https://cache.numtide.com
          NIX_EXTRA_TRUSTED_PUBLIC_KEYS: |
            ${{ env.CACHIX_PUBLIC_KEY }}
            niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y curl ca-certificates xz-utils

          curl -fsSL https://nixos.org/nix/install | sh -s -- --daemon

          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
          echo "NIX_REMOTE=daemon" >> "$GITHUB_ENV"

          export NIX_REMOTE=daemon
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh

          normalize_list() {
            local s="${1:-}"
            s="${s//$'\n'/ }"
            s="${s//$'\t'/ }"
            printf '%s\n' "$s" | awk '{$1=$1; print}'
          }

          current_user="$(id -un)"

          nix_experimental_features="$(
            normalize_list "${NIX_EXPERIMENTAL_FEATURES:-nix-command flakes}"
          )"

          nix_trusted_users="$(
            normalize_list "${NIX_TRUSTED_USERS:-root ${current_user}}"
          )"

          nix_max_jobs="$(
            normalize_list "${NIX_MAX_JOBS:-auto}"
          )"

          nix_access_tokens="$(
            normalize_list "${NIX_ACCESS_TOKENS:-}"
          )"

          if [[ -z "$nix_access_tokens" && -n "${GITHUB_ACCESS_TOKEN:-}" ]]; then
            nix_access_tokens="github.com=${GITHUB_ACCESS_TOKEN}"
          fi

          nix_extra_substituters="$(
            normalize_list "${NIX_EXTRA_SUBSTITUTERS:-}"
          )"

          nix_extra_trusted_public_keys="$(
            normalize_list "${NIX_EXTRA_TRUSTED_PUBLIC_KEYS:-}"
          )"

          sudo mkdir -p /etc/nix
          sudo touch /etc/nix/nix.conf

          sudo sed -i \
            -e '/^[[:space:]]*experimental-features[[:space:]]*=/d' \
            -e '/^[[:space:]]*max-jobs[[:space:]]*=/d' \
            -e '/^[[:space:]]*trusted-users[[:space:]]*=/d' \
            -e '/^[[:space:]]*access-tokens[[:space:]]*=/d' \
            -e '/^[[:space:]]*substituters[[:space:]]*=/d' \
            -e '/^[[:space:]]*trusted-public-keys[[:space:]]*=/d' \
            -e '/^[[:space:]]*extra-substituters[[:space:]]*=/d' \
            -e '/^[[:space:]]*extra-trusted-public-keys[[:space:]]*=/d' \
            /etc/nix/nix.conf

          {
            printf '\n'
            printf '%s\n' '# CI Nix settings'
            printf '%s\n' "experimental-features = ${nix_experimental_features}"
            printf '%s\n' "max-jobs = ${nix_max_jobs}"
            printf '%s\n' "trusted-users = ${nix_trusted_users}"

            if [[ -n "$nix_access_tokens" ]]; then
              printf '%s\n' "access-tokens = ${nix_access_tokens}"
            fi

            if [[ -n "$nix_extra_substituters" ]]; then
              printf '%s\n' "extra-substituters = ${nix_extra_substituters}"
            fi

            if [[ -n "$nix_extra_trusted_public_keys" ]]; then
              printf '%s\n' "extra-trusted-public-keys = ${nix_extra_trusted_public_keys}"
            fi
          } | sudo tee -a /etc/nix/nix.conf >/dev/null

          sudo systemctl restart nix-daemon.service

          nix --version
          nix config show experimental-features
          nix config show substituters
          nix config show trusted-public-keys
          nix config show trusted-users

      - name: Build reports
        run: |
          nix build --accept-flake-config .#images.go-1_25.reports --print-out-paths --no-link > report-path.txt
          cp -R "$(cat report-path.txt)" reports

      - name: Validate reports
        run: |
          nix build --accept-flake-config .#checks.x86_64-linux.reports-go-1_25 --no-link

      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: reports-go-1_25
          path: reports

      - name: Build OCI image artifact
        run: |
          nix build --accept-flake-config .#images.go-1_25.oci --print-out-paths --no-link > oci-path.txt

      - name: Validate OCI image artifact
        run: |
          nix build --accept-flake-config .#checks.x86_64-linux.artifact-image-go-1_25 --no-link

      - name: Load OCI image
        run: |
          nix run --accept-flake-config .#load-go-1_25

      - name: Run smoke plan
        env:
          SMOKE_LOG_DIR: smoke-logs
        run: |
          nix run --accept-flake-config .#run-smoke-plan -- go-1_25

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-go-1_25
          path: smoke-logs

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          image_ref="$(jq -r '.imageRef' reports/ci-plan.json)"
          mapfile -t publish_refs < <(jq -r '.publishRefs[]' reports/ci-plan.json)
          for publish_ref in "${publish_refs[@]}"; do
            if [ "$publish_ref" != "$image_ref" ]; then
              docker tag "$image_ref" "$publish_ref"
            fi
            docker push "$publish_ref"
          done
          docker inspect "$image_ref" --format='{{index .RepoDigests 0}}' > digest.txt

      - name: Upload digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: digest-go-1_25
          path: digest.txt

  e2e:
    name: e2e-go-1_25-${{ matrix.session }}
    needs: build
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        session: ["disabled"]
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          docker system prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix with official installer
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y xz-utils

          curl -L https://nixos.org/nix/install | sh -s -- --daemon

          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
          echo "NIX_REMOTE=daemon" >> "$GITHUB_ENV"

          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh

          nix --version

      - name: Configure Nix
        shell: bash
        run: |
          set -euxo pipefail

          sudo sed -i \
            -e '/^experimental-features[[:space:]]*=/d' \
            -e '/^max-jobs[[:space:]]*=/d' \
            -e '/^substituters[[:space:]]*=/d' \
            -e '/^trusted-public-keys[[:space:]]*=/d' \
            -e '/^trusted-users[[:space:]]*=/d' \
            /etc/nix/nix.conf

          printf '%s\n' \
            "experimental-features = nix-command flakes" \
            "max-jobs = auto" \
            "trusted-users = root ${USER}" \
            "extra-substituters = https://${CACHIX_CACHE_NAME}.cachix.org" \
            "extra-trusted-public-keys = ${CACHIX_PUBLIC_KEY}" \
            | sudo tee -a /etc/nix/nix.conf

          sudo systemctl restart nix-daemon

          nix config show experimental-features
          nix config show substituters

      - name: Enable KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "/dev/kvm is missing; e2e requires a KVM-capable runner" >&2
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Run e2e test
        run: |
          set -euo pipefail

          attr=".#e2e.x86_64-linux.e2e-vscode-go-1_25-${{ matrix.session }}"
          drv_path="$(
            nix path-info \
              --accept-flake-config \
              --derivation \
              "$attr"
          )"
          printf '%s\n' "$drv_path" > e2e-drv-path.txt

          set +e
          NO_COLOR=1 TERM=dumb nix build \
            --accept-flake-config \
            "$attr" \
            --print-out-paths \
            --no-link \
            >e2e-output-path.txt \
            2>e2e-build.stderr.log
          status="$?"
          set -e

          if [ "$status" -eq 0 ]; then
            output_path="$(tail -n1 e2e-output-path.txt)"
            test -n "$output_path"
            mkdir -p e2e-output
            if [ -d "$output_path" ]; then
              cp -R "$output_path"/. e2e-output/
            else
              cp -R "$output_path" e2e-output/
            fi
            exit 0
          fi

          mkdir -p e2e-logs
          cp e2e-build.stderr.log e2e-logs/
          NO_COLOR=1 TERM=dumb nix \
            --extra-experimental-features nix-command \
            --extra-experimental-features flakes \
            --log-format raw \
            log "$drv_path" \
            >"e2e-logs/$(basename "$drv_path").log" \
            2>&1 || true
          sed -r -i 's/\x1B\[[0-9;]*[mK]//g' e2e-logs/*.log
          exit "$status"

      - name: Upload e2e output
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output-go-1_25-${{ matrix.session }}
          path: e2e-output
          if-no-files-found: error

      - name: Upload e2e nix logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-nix-logs-go-1_25-${{ matrix.session }}
          path: e2e-logs
          if-no-files-found: warn
