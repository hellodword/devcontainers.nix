name: build-image-go-web

on:
  workflow_dispatch:
  push:
    branches: [ master ]

concurrency:
  group: build-image-go-web
  cancel-in-progress: true

jobs:
  build:
    name: build-go-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          docker system prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        run: |
          sudo mkdir -p /etc/nix
          printf '%s\n' 'experimental-features = nix-command flakes' | sudo tee -a /etc/nix/nix.conf
          curl -L https://nixos.org/nix/install | sh -s -- --daemon --yes
          echo '/nix/var/nix/profiles/default/bin' >> "$GITHUB_PATH"

      - name: Build reports
        run: |
          nix build --extra-experimental-features nix-command --extra-experimental-features flakes .#images.go-web.reports --print-out-paths --no-link > report-path.txt
          cp -R "$(cat report-path.txt)" reports

      - name: Validate reports
        run: |
          nix build --extra-experimental-features nix-command --extra-experimental-features flakes .#checks.x86_64-linux.reports-go-web --no-link

      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: reports-go-web
          path: reports

      - name: Build OCI image artifact
        run: |
          nix build --extra-experimental-features nix-command --extra-experimental-features flakes .#images.go-web.oci --print-out-paths --no-link > oci-path.txt

      - name: Validate OCI image artifact
        run: |
          nix build --extra-experimental-features nix-command --extra-experimental-features flakes .#checks.x86_64-linux.artifact-image-go-web --no-link

      - name: Load OCI image
        run: |
          nix run --extra-experimental-features nix-command --extra-experimental-features flakes .#load-go-web

      - name: Run smoke plan
        env:
          SMOKE_LOG_DIR: smoke-logs
        run: |
          nix run --extra-experimental-features nix-command --extra-experimental-features flakes .#run-smoke-plan -- go-web

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-go-web
          path: smoke-logs

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          image_ref="$(jq -r '.imageRef' reports/ci-plan.json)"
          mapfile -t publish_refs < <(jq -r '.publishRefs[]' reports/ci-plan.json)
          for publish_ref in "${publish_refs[@]}"; do
            if [ "$publish_ref" != "$image_ref" ]; then
              docker tag "$image_ref" "$publish_ref"
            fi
            docker push "$publish_ref"
          done
          docker inspect "$image_ref" --format='{{index .RepoDigests 0}}' > digest.txt

      - name: Upload digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: digest-go-web
          path: digest.txt
